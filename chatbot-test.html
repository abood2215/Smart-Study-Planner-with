<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .result pre {
            background: white;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            color: #666;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .error {
            color: #e74c3c;
            padding: 12px;
            background: #fadbd8;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .success {
            color: #27ae60;
            padding: 12px;
            background: #d5f4e6;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .info {
            background: #e8f4f8;
            color: #16a085;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Chatbot API Test</h1>
        
        <div class="info">
            <strong>ℹ️ Instructions:</strong>
            <ol>
                <li>Copy your authentication token from the browser console (localStorage.getItem('token'))</li>
                <li>Paste it in the "Token" field below</li>
                <li>Enter your test message</li>
                <li>Click "Send Message"</li>
            </ol>
        </div>
        
        <form id="testForm">
            <div class="form-group">
                <label for="token">Authentication Token</label>
                <input type="text" id="token" name="token" placeholder="Paste your JWT token here..." required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="What do you want to ask the AI?" rows="4" required></textarea>
            </div>
            
            <button type="submit">Send Message</button>
        </form>
        
        <div id="result" style="display:none;" class="result">
            <h3>Response</h3>
            <pre id="resultContent"></pre>
        </div>
    </div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = document.getElementById('token').value.trim();
            const message = document.getElementById('message').value.trim();
            
            if (!token || !message) {
                alert('Please fill in all fields');
                return;
            }
            
            try {
                console.log('📡 Sending request...');
                console.log('Token:', token.substring(0, 30) + '...');
                console.log('Message:', message);
                
                const response = await fetch('/Smart-Study-Planner-with/backend/api/chatbot.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message: message })
                });
                
                console.log('📊 Response Status:', response.status);
                
                const data = await response.json();
                
                console.log('✅ Response Data:', data);
                
                const resultDiv = document.getElementById('result');
                const resultContent = document.getElementById('resultContent');
                
                resultDiv.style.display = 'block';
                
                if (response.ok && data.success) {
                    resultContent.innerHTML = `<span class="success">✅ SUCCESS</span>\n\nResponse:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultContent.innerHTML = `<span class="error">❌ ERROR</span>\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                
                const resultDiv = document.getElementById('result');
                const resultContent = document.getElementById('resultContent');
                
                resultDiv.style.display = 'block';
                resultContent.innerHTML = `<span class="error">❌ NETWORK ERROR</span>\n\n${error.message}`;
            }
        });
        
        // Auto-fill token if available
        window.addEventListener('load', () => {
            const token = localStorage.getItem('auth_token');
            if (token) {
                document.getElementById('token').value = token;
                console.log('✅ Token auto-filled from localStorage');
            } else {
                console.warn('⚠️ No token found in localStorage - you may need to login first');
            }
        });
    </script>
</body>
</html>
