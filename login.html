<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            direction: ltr;
        }

        /* Floating Particles Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-10deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(155, 89, 182, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(155, 89, 182, 0.8)); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Left Side - Login Section */
        .login-section {
            flex: 1;
            background-color: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Particles */
        .login-section::before,
        .login-section::after {
            content: '✨';
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        .login-section::before {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .login-section::after {
            bottom: 20%;
            right: 10%;
            animation-delay: 2s;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 2;
        }

        .login-box h1 {
            color: #ffffff;
            font-size: 42px;
            margin-bottom: 8px;
            font-weight: 600;
            animation: glow 3s ease-in-out infinite;
        }

        .login-box .subtitle {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px 35px 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #404040;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-bottom-color: #9b59b6;
            transform: translateX(5px);
        }

        .input-group input:focus + .input-icon {
            animation: shake 0.5s;
        }

        .input-icon {
            position: absolute;
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            transition: all 0.3s;
        }

        .input-group input::placeholder {
            color: #606060;
        }

        .toggle-password {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #808080;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s;
        }

        .toggle-password:hover {
            transform: translateY(-50%) scale(1.2);
            animation: pulse 0.5s;
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
            position: relative;
        }

        .forgot-password a:hover {
            color: #9b59b6;
        }

        .forgot-password a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: #9b59b6;
            transition: width 0.3s;
        }

        .forgot-password a:hover::after {
            width: 100%;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9b59b6, #a770ef, #9b59b6);
            background-size: 200% 200%;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            animation: gradientShift 3s ease infinite;
        }

        .login-btn::before {
            content: '🚀';
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            transition: all 0.4s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }

        .login-btn:hover::before {
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .signup-prompt {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }

        .signup-prompt span {
            color: #808080;
        }

        .signup-btn {
            background: transparent;
            border: 1px solid #404040;
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 6px;
            margin-left: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(155, 89, 182, 0.2);
            transition: width 0.4s, height 0.4s, top 0.4s, left 0.4s;
        }

        .signup-btn:hover::before {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
        }

        .signup-btn:hover {
            border-color: #9b59b6;
            transform: translateY(-2px);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert.show {
            display: block;
        }

        /* Right Side - Welcome Section */
        .welcome-section {
            flex: 1;
            background: linear-gradient(135deg, #b794f6 0%, #8b5cf6 50%, #b794f6 100%);
            background-size: 200% 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
            animation: gradientShift 6s ease infinite;
        }

        /* Floating Emojis in Background */
        .floating-emoji {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            animation: float 6s ease-in-out infinite;
        }

        .emoji-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .emoji-2 { top: 70%; left: 10%; animation-delay: 1s; }
        .emoji-3 { top: 30%; right: 8%; animation-delay: 2s; }
        .emoji-4 { bottom: 15%; right: 15%; animation-delay: 3s; }
        .emoji-5 { top: 50%; left: 15%; animation-delay: 1.5s; animation: floatReverse 5s ease-in-out infinite; }
        .emoji-6 { top: 85%; right: 5%; animation-delay: 2.5s; animation: floatReverse 7s ease-in-out infinite; }

        .welcome-card {
            background: rgba(199, 176, 246, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 60px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        .welcome-card h2 {
            color: #ffffff;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .welcome-card .welcome-subtitle {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 50px;
            opacity: 0.95;
        }

        .illustration-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        /* Enhanced Emojis Display */
        .hero-emoji {
            font-size: 120px;
            display: block;
            margin: 30px auto;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .emoji-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .emoji-item {
            font-size: 50px;
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s;
        }

        .emoji-item:hover {
            transform: scale(1.3) rotate(15deg);
            filter: drop-shadow(0 5px 15px rgba(155, 89, 182, 0.8));
        }

        .emoji-item:nth-child(2) {
            animation-delay: 0.5s;
        }

        .emoji-item:nth-child(3) {
            animation-delay: 1s;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .login-section {
                min-height: 50vh;
            }

            .welcome-section {
                min-height: 50vh;
                padding: 40px 20px;
            }

            .welcome-card h2 {
                font-size: 36px;
            }

            .hero-emoji {
                font-size: 80px;
            }

            .emoji-item {
                font-size: 35px;
            }
        }

        @media (max-width: 480px) {
            .login-box h1 {
                font-size: 32px;
            }

            .welcome-card {
                padding: 40px 30px;
            }

            .welcome-card h2 {
                font-size: 28px;
            }

            .hero-emoji {
                font-size: 60px;
            }
        }
    </style>
    <script>
        // Ensure we run over HTTP and compute a BASE that respects the current port
        (function() {
            var base = (location.protocol === 'file:')
                ? 'http://localhost/smart-study-planner'
                : (location.origin + '/smart-study-planner');
            window.APP_BASE = base;
            if (location.protocol === 'file:') {
                location.replace(base + '/login.html');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div class="login-section">
            <div class="login-box">
                <h1>Login 🔐</h1>
                <p class="subtitle">Enter your account details</p>

                <form id="loginForm">
                    <div class="alert alert-error" id="errorMsg"></div>

                    <div class="input-group">
                        <label>📧 Email</label>
                        <input type="email" id="email" name="email" required placeholder="">
                    </div>

                    <div class="input-group">
                        <label>🔑 Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="">
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                👁️
                            </button>
                        </div>
                        <div class="forgot-password">
                            <a href="#">Forgot Password? 🤔</a>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="signup-prompt">
                    <span>Don't have an account? 🤷‍♂️</span>
                    <a href="register.html" class="signup-btn">Sign up ✨</a>
                </div>
            </div>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <!-- Floating Emojis -->
            <div class="floating-emoji emoji-1">📚</div>
            <div class="floating-emoji emoji-2">🎯</div>
            <div class="floating-emoji emoji-3">⭐</div>
            <div class="floating-emoji emoji-4">💡</div>
            <div class="floating-emoji emoji-5">🚀</div>
            <div class="floating-emoji emoji-6">✨</div>

            <div class="welcome-card">
                <h2>Welcome to 🎓<br>Student Portal</h2>
                <p class="welcome-subtitle">Login to access your account</p>

                <div class="illustration-container">
                    <div class="hero-emoji">🎓</div>
                    <div class="emoji-row">
                        <span class="emoji-item">📖</span>
                        <span class="emoji-item">💻</span>
                        <span class="emoji-item">🏆</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(window.APP_BASE + '/includes/api_auth.php?action=login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    try {
                        localStorage.setItem('currentUser', email);
                        // Ensure users store has this user so dashboard can resolve it
                        const usersRaw = localStorage.getItem('users') || '[]';
                        const users = JSON.parse(usersRaw);
                        if (!users.some(u => u.email === email)) {
                            users.push({
                                id: Date.now(),
                                username: email.split('@')[0] || 'User',
                                email: email,
                                password: '',
                                studyHoursPerDay: 2,
                                preferredTime: 'evening',
                                createdAt: new Date().toISOString()
                            });
                            localStorage.setItem('users', JSON.stringify(users));
                        }
                    } catch (e) {}
                    window.location.href = window.APP_BASE + '/dashboard.html';
                } else {
                    errorMsg.textContent = '❌ ' + (data.message || 'Login failed. Please try again.');
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '❌ An error occurred. Please try again.';
                errorMsg.classList.add('show');
            }
        });

        // Add interactive emoji effects
        document.querySelectorAll('.emoji-item').forEach(emoji => {
            emoji.addEventListener('click', function() {
                this.style.animation = 'none';
                setTimeout(() => {
                    this.style.animation = '';
                }, 10);
            });
        });
    </script>
</body>
</html>
