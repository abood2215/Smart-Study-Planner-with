<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Smart Study Planner</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/chatbot.css">
</head>
<body class="dashboard-page">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="dashboard-icon">📚</div>
            <h2 class="">Study Planner</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li class="active"><a href="courses.html">📖 Courses</a></li>
            <li><a href="tasks.html">📝 Tasks</a></li>
            <li><a href="schedule.html">📅 Weekly Schedule</a></li>
            <li><a href="calendar.html">🗓️ Calendar</a></li>
            <li><a href="analytics.html">📊 Analytics</a></li>
            <li><a href="projects.html">🚀 Project Hub</a></li>
            <li><a href="settings.html">⚙️ Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-danger btn-block">Logout</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="dashboard-header">
            <div class="section-header">
                <div class="header-left">
                    <div class="dashboard-section-item">
                        <div class="dashboard-icon">📖</div>
                        <h1>Courses</h1>
                    </div>
                    <p>Manage your courses and update their information</p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" onclick="openModal('addCourseModal')">
                     ➕ Add New Course
                </button>
            </div>
        </div>
        <div id="coursesContainer" class="features-grid"></div>
    </main>

        
    

    <div id="addCourseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Course</h2>
                <span class="close" onclick="closeModal('addCourseModal')">&times;</span>
            </div>
            <form id="addCourseForm">
                <div class="form-group">
                    <label for="courseName">Course Name</label>
                    <input type="text" id="courseName" required placeholder="Example: Web Programming">
                </div>
                <div class="form-group">
                    <label for="difficultyLevel">Difficulty Level (1-5)</label>
                    <select id="difficultyLevel" required>
                        <option value="">Select Level</option>
                        <option value="1">1 - Very Easy</option>
                        <option value="2">2 - Easy</option>
                        <option value="3">3 - Medium</option>
                        <option value="4">4 - Hard</option>
                        <option value="5">5 - Very Hard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="estimatedHoursPerWeek">Estimated Hours Per Week</label>
                    <input type="number" id="estimatedHoursPerWeek" min="1" max="40" value="5" required>
                </div>
                <div class="form-group">
                    <label for="currentGrade">Current Grade (Optional)</label>
                    <input type="number" id="currentGrade" min="0" max="100" step="0.1" placeholder="0-100">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addCourseModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Course</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editCourseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Course</h2>
                <span class="close" onclick="closeModal('editCourseModal')">&times;</span>
            </div>
            <form id="editCourseForm">
                <input type="hidden" id="editCourseId">
                <div class="form-group">
                    <label for="editCourseName">Course Name</label>
                    <input type="text" id="editCourseName" required>
                </div>
                <div class="form-group">
                    <label for="editDifficultyLevel">Difficulty Level (1-5)</label>
                    <select id="editDifficultyLevel" required>
                        <option value="1">1 - Very Easy</option>
                        <option value="2">2 - Easy</option>
                        <option value="3">3 - Medium</option>
                        <option value="4">4 - Hard</option>
                        <option value="5">5 - Very Hard</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editEstimatedHoursPerWeek">Estimated Hours Per Week</label>
                    <input type="number" id="editEstimatedHoursPerWeek" min="1" max="40" required>
                </div>
                <div class="form-group">
                    <label for="editCurrentGrade">Current Grade</label>
                    <input type="number" id="editCurrentGrade" min="0" max="100" step="0.1">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('editCourseModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    

    <!-- <script src="assets/js/storage.js"></script>
    <script src="assets/js/courses.js"></script> -->
    <script src="assets/js/courses-api.js"></script>
    <script src="assets/js/chatbot.js"></script>
</body>
</html>
