<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hub - Smart Study Planner</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/projects.css">
    <style>
        /* Projects Page Specific Styles */
        .projects-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--gray-900);
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--gray-600);
        }

        .section-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .section-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--gray-900);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .interest-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .interest-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition-fast);
        }

        .interest-input input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
        }

        .interest-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .interest-tag {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 8px 15px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .interest-tag:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-purple);
        }

        .interest-tag .remove-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: var(--transition-fast);
        }

        .interest-tag .remove-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .project-ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .project-idea-card {
            position: relative;
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 2px solid transparent;
            transition: var(--transition);
            cursor: pointer;
            min-height: 200px;
        }

        .project-idea-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: var(--shadow-purple);
        }

        .project-idea-card.selected {
            border-color: var(--primary-light);
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15) 0%, rgba(167, 112, 239, 0.15) 100%);
            box-shadow: 0 8px 24px rgba(155, 89, 182, 0.3);
        }

        .project-idea-card.selected::after {
            content: '✓ Selected';
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: bold;
        }

        .project-idea-card h3 {
            color: var(--gray-900);
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .project-idea-card p {
            color: var(--gray-600);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .projects-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .project-card {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 20px;
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
        }

        .project-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
        }

        .project-card h3 {
            color: var(--gray-900);
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .project-card .project-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .project-card .project-description {
            color: var(--gray-700);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .project-card .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray-600);
            font-size: 0.9rem;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-light) 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(16, 185, 129, 0.5);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray-600);
        }

        .spinner {
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gray-200);
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--gray-600);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition-fast);
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        .tab:hover {
            color: var(--primary);
        }

        .alert {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-content">
                    <div class="feature-icon">🚀</div>
                    <h2>Project Hub</h2>
                </div>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Study Planner</a>
                <a href="profile.html">Profile</a>
                <span id="userName" style="color: var(--gray-700); font-weight: 500; margin-right: 10px;">Loading...</span>
                <a href="#" onclick="logout()" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </nav>

    <div class="projects-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>🚀 Project Hub</h1>
            <p>Discover project ideas, build your team, and bring your ideas to life</p>
        </div>

        <!-- Interests Section -->
        <div class="section-card">
            <h2 class="section-title">
                <span>💡</span>
                <span>Your Interests</span>
            </h2>
            <div class="interest-input">
                <input
                    type="text"
                    id="interestInput"
                    placeholder="Add your interests (e.g., Web Development, AI, Mobile Apps)"
                    onkeypress="if(event.key==='Enter') addInterest()"
                >
                <button class="btn btn-primary" onclick="addInterest()">Add</button>
            </div>
            <div class="interest-tags" id="interestTags"></div>
            <button class="btn btn-primary" onclick="generateProjectIdeas()" id="generateBtn">
                ✨ Generate Project Ideas with AI
            </button>
        </div>

        <!-- AI Generated Project Ideas -->
        <div class="section-card" id="projectIdeasSection" style="display: none;">
            <h2 class="section-title">
                <span>🤖</span>
                <span>AI Generated Project Ideas</span>
            </h2>
            <div id="projectIdeasContainer"></div>
            <button class="btn btn-success" onclick="createSelectedProject()" id="createProjectBtn" style="margin-top: 20px; display: none;">
                Create Selected Project
            </button>
        </div>

        <!-- My Projects Section -->
        <div class="section-card">
            <h2 class="section-title">
                <span>📁</span>
                <span>My Projects</span>
            </h2>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('owned')">My Projects</button>
                <button class="tab" onclick="switchTab('member')">Projects I'm a Member In</button>
            </div>
            <div id="projectsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading projects...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/api-config.js?v=2.0"></script>
    <script src="assets/js/projects.js?v=2.0"></script>
    <script>
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication (support multiple token types)
            const token = localStorage.getItem('token') ||
                         localStorage.getItem('auth_token') ||
                         localStorage.getItem('currentUser');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // Active link handling
            const currentPath = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });

            // Navbar scroll effect
            const navbar = document.querySelector('.navbar');
            if (navbar) {
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 50) {
                        navbar.classList.add('scrolled');
                    } else {
                        navbar.classList.remove('scrolled');
                    }
                });
            }

            // Load user name
            loadUserName();

            // Load user interests
            loadUserInterests();

            // Load projects
            loadProjects('owned');
        });

        // Load and display user name
        async function loadUserName() {
            try {
                const token = localStorage.getItem('token') ||
                             localStorage.getItem('auth_token') ||
                             localStorage.getItem('currentUser');

                const response = await fetch(`${API_BASE_URL}/backend/api/auth.php?action=profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const result = await response.json();

                if (result.success) {
                    const user = result.data.user || result.data;
                    document.getElementById('userName').textContent = user.name || 'User';
                } else {
                    document.getElementById('userName').textContent = '';
                }
            } catch (error) {
                console.error('Error loading user name:', error);
                document.getElementById('userName').textContent = '';
            }
        }
    </script>
</body>
</html>
