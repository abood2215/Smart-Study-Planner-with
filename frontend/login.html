<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div class="login-section">
            <div class="login-box">
                <h1>Login 🔐</h1>
                <p class="subtitle">Enter your account details</p>

                <form id="loginForm">
                    <div class="alert alert-error" id="errorMsg"></div>
                    <div class="alert alert-success" id="successMsg"></div>

                    <div class="input-group">
                        <label>📧 Email</label>
                        <input type="email" id="email" name="email" required placeholder="">
                    </div>

                    <div class="input-group">
                        <label>🔑 Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="">
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                👁️
                            </button>
                        </div>
                        <div class="forgot-password">
                            <a href="#">Forgot Password? 🤔</a>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="signup-prompt">
                    <span>Don't have an account? 🤷‍♂️</span>
                    <a href="register.html" class="signup-btn">Sign up ✨</a>
                </div>
            </div>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <!-- Floating Emojis -->
            <div class="floating-emoji emoji-1">📚</div>
            <div class="floating-emoji emoji-2">🎯</div>
            <div class="floating-emoji emoji-3">⭐</div>
            <div class="floating-emoji emoji-4">💡</div>
            <div class="floating-emoji emoji-5">🚀</div>
            <div class="floating-emoji emoji-6">✨</div>

            <div class="welcome-card">
                <h2>Welcome to 🎓<br>Student Portal</h2>
                <p class="welcome-subtitle">Login to access your account</p>

                <div class="illustration-container">
                    <div class="hero-emoji">🎓</div>
                    <div class="emoji-row">
                        <span class="emoji-item">📖</span>
                        <span class="emoji-item">💻</span>
                        <span class="emoji-item">🏆</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/login-new.js"></script>
</body>
</html>
