<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/chatbot.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .task-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }

        .task-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }

        .task-header-content {
            position: relative;
            z-index: 2;
        }

        .task-header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .task-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 11px;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .meta-value {
            font-size: 18px;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            width: fit-content;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-in-progress {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .task-content {
            padding: 50px 40px;
        }

        .section {
            margin-bottom: 45px;
        }

        .section h2 {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
            letter-spacing: -0.3px;
        }

        .progress-section {
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f5ff 100%);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            background: #e0e0e0;
            border-radius: 7px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.4s ease;
            border-radius: 7px;
        }

        .progress-text {
            font-size: 15px;
            color: #555;
            font-weight: 600;
        }

        .task-description {
            color: #555;
            line-height: 1.8;
            font-size: 16px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f5ff 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .info-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.15);
        }

        .info-card h3 {
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .info-card p {
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 80px 40px;
            color: #667eea;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fadbd8;
            color: #c0392b;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #c0392b;
            font-weight: 500;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            margin-bottom: 30px;
            transition: all 0.3s;
            font-size: 15px;
        }

        .back-button:hover {
            color: #764ba2;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }

            .task-header {
                padding: 35px 25px;
            }

            .task-header h1 {
                font-size: 28px;
            }

            .task-meta {
                gap: 20px;
                grid-template-columns: 1fr;
            }

            .task-content {
                padding: 30px 25px;
            }

            .section h2 {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
                padding: 12px 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .task-header {
                padding: 25px 15px;
            }

            .task-header h1 {
                font-size: 24px;
            }

            .task-content {
                padding: 20px 15px;
            }

            .meta-label {
                font-size: 10px;
            }

            .meta-value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <a href="tasks.html" class="back-button">← Back to Tasks</a>

    <div class="container">
        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading task details...</p>
            </div>
        </div>
    </div>

    <script src="assets/js/chatbot.js"></script>
    <script>
        // Get task ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');

        if (!taskId) {
            document.getElementById('content').innerHTML = `
                <div class="task-header">
                    <h1>Error</h1>
                </div>
                <div class="task-content">
                    <div class="error">Task ID not specified in URL. Please use: task-details.html?id=TASK_ID</div>
                </div>
            `;
        } else {
            // Fetch task details
            fetchTaskDetails(taskId);
        }

        async function fetchTaskDetails(id) {
            try {
                const token = localStorage.getItem('auth_token');
                
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch(`/Smart-Study-Planner-with/backend/api/tasks.php?id=${id}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.success && data.data) {
                    const task = data.data;
                    renderTaskDetails(task);
                } else {
                    throw new Error(data.message || 'Task not found');
                }
            } catch (error) {
                console.error('Error fetching task:', error);
                document.getElementById('content').innerHTML = `
                    <div class="task-header">
                        <h1>Error</h1>
                    </div>
                    <div class="task-content">
                        <div class="error">
                            <strong>Failed to load task details:</strong><br>
                            ${error.message}
                        </div>
                        <button class="btn btn-primary" onclick="location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        function renderTaskDetails(task) {
            const statusMap = {
                'completed': 'Completed',
                'in_progress': 'In Progress',
                'pending': 'Pending'
            };

            const statusClass = {
                'completed': 'status-completed',
                'in_progress': 'status-in-progress',
                'pending': 'status-pending'
            };

            const deadline = new Date(task.deadline);
            const today = new Date();
            const daysLeft = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));

            let html = `
                <div class="task-header">
                    <div class="task-header-content">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                            <span class="status-badge ${statusClass[task.status]}">${statusMap[task.status] || task.status}</span>
                        </div>
                        <h1>${escapeHtml(task.title)}</h1>
                        <div class="task-meta">
                            <div class="meta-item">
                                <span class="meta-label">📚 Course</span>
                                <span class="meta-value">${escapeHtml(task.course_name || 'N/A')}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">📅 Deadline</span>
                                <span class="meta-value">${deadline.toLocaleDateString()}</span>
                                <span style="font-size: 13px; opacity: 0.9; margin-top: 4px;">${daysLeft > 0 ? daysLeft + ' days left' : 'Overdue'}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">⚡ Difficulty</span>
                                <span class="meta-value">${escapeHtml(task.difficulty || 'N/A').toUpperCase()}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="task-content">
                    <div class="section">
                        <h2>Progress</h2>
                        <div class="progress-section">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${task.progress || 0}%"></div>
                            </div>
                            <div class="progress-text">${task.progress || 0}% Complete</div>
                        </div>
                    </div>

                    ${task.description ? `
                    <div class="section">
                        <h2>Description</h2>
                        <p class="task-description">${escapeHtml(task.description)}</p>
                    </div>
                    ` : ''}

                    <div class="section">
                        <h2>Details</h2>
                        <div class="info-grid">
                            <div class="info-card">
                                <h3>Priority</h3>
                                <p>${escapeHtml(task.priority || 'Normal')}</p>
                            </div>
                            <div class="info-card">
                                <h3>Time Estimate</h3>
                                <p>${task.estimated_hours || 'Not set'} hours</p>
                            </div>
                            <div class="info-card">
                                <h3>Created</h3>
                                <p>${new Date(task.created_at).toLocaleDateString()}</p>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h2>Actions</h2>
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="updateTaskStatus('${task.id}', '${task.status}')">
                                ${task.status === 'completed' ? 'Mark as Pending' : 'Mark as Completed'}
                            </button>
                            <button class="btn btn-secondary" onclick="history.back()">Back</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        async function updateTaskStatus(taskId, currentStatus) {
            const newStatus = currentStatus === 'completed' ? 'pending' : 'completed';
            
            try {
                const token = localStorage.getItem('auth_token');
                
                if (!token) {
                    alert('Please log in first');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch(`/Smart-Study-Planner-with/backend/api/tasks.php?id=${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        status: newStatus
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert('Task updated successfully!');
                    location.reload();
                } else {
                    alert('Failed to update task: ' + (data.message || 'Unknown error'));
                    console.error('Update error:', data);
                }
            } catch (error) {
                console.error('Error updating task:', error);
                alert('Error: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
