<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
            direction: ltr;
        }

        /* Floating Particles Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-10deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(155, 89, 182, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(155, 89, 182, 0.8)); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Left Side - Register Section */
        .register-section {
            flex: 1;
            background-color: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Particles */
        .register-section::before,
        .register-section::after {
            content: '✨';
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        .register-section::before {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .register-section::after {
            bottom: 20%;
            right: 10%;
            animation-delay: 2s;
        }

        .register-box {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
        }

        .register-box h1 {
            color: #ffffff;
            font-size: 42px;
            margin-bottom: 8px;
            font-weight: 600;
            animation: glow 3s ease-in-out infinite;
        }

        .register-box .subtitle {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 35px 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #404040;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group select {
            cursor: pointer;
        }

        .input-group select option {
            background: #0f0f0f;
            color: #ffffff;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-bottom-color: #9b59b6;
            transform: translateX(5px);
        }

        .input-group input::placeholder {
            color: #606060;
        }

        .input-group small {
            display: block;
            color: #808080;
            font-size: 11px;
            margin-top: 4px;
        }

        .toggle-password {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #808080;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s;
        }

        .toggle-password:hover {
            transform: translateY(-50%) scale(1.2);
            animation: pulse 0.5s;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9b59b6, #a770ef, #9b59b6);
            background-size: 200% 200%;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            animation: gradientShift 3s ease infinite;
        }

        .register-btn::before {
            content: '🎉';
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            transition: all 0.4s;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(155, 89, 182, 0.6);
        }

        .register-btn:hover::before {
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .login-prompt {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }

        .login-prompt span {
            color: #808080;
        }

        .login-btn {
            background: transparent;
            border: 1px solid #404040;
            color: #ffffff;
            padding: 8px 24px;
            border-radius: 6px;
            margin-left: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(155, 89, 182, 0.2);
            transition: width 0.4s, height 0.4s, top 0.4s, left 0.4s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
        }

        .login-btn:hover {
            border-color: #9b59b6;
            transform: translateY(-2px);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert.show {
            display: block;
        }

        /* Right Side - Welcome Section */
        .welcome-section {
            flex: 1;
            background: linear-gradient(135deg, #b794f6 0%, #8b5cf6 50%, #b794f6 100%);
            background-size: 200% 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
            animation: gradientShift 6s ease infinite;
        }

        /* Floating Emojis in Background */
        .floating-emoji {
            position: absolute;
            font-size: 40px;
            opacity: 0.4;
            animation: float 6s ease-in-out infinite;
        }

        .emoji-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .emoji-2 { top: 70%; left: 10%; animation-delay: 1s; }
        .emoji-3 { top: 30%; right: 8%; animation-delay: 2s; }
        .emoji-4 { bottom: 15%; right: 15%; animation-delay: 3s; }
        .emoji-5 { top: 50%; left: 15%; animation-delay: 1.5s; animation: floatReverse 5s ease-in-out infinite; }
        .emoji-6 { top: 85%; right: 5%; animation-delay: 2.5s; animation: floatReverse 7s ease-in-out infinite; }
        .emoji-7 { top: 15%; right: 25%; animation-delay: 4s; animation: floatReverse 6s ease-in-out infinite; }

        .welcome-card {
            background: rgba(199, 176, 246, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 60px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        .welcome-card h2 {
            color: #ffffff;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .welcome-card .welcome-subtitle {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 50px;
            opacity: 0.95;
        }

        .illustration-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        /* Enhanced Emojis Display */
        .hero-emoji {
            font-size: 120px;
            display: block;
            margin: 30px auto;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        .emoji-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .emoji-item {
            font-size: 50px;
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s;
        }

        .emoji-item:hover {
            transform: scale(1.3) rotate(15deg);
            filter: drop-shadow(0 5px 15px rgba(155, 89, 182, 0.8));
        }

        .emoji-item:nth-child(2) {
            animation-delay: 0.5s;
        }

        .emoji-item:nth-child(3) {
            animation-delay: 1s;
        }

        .emoji-item:nth-child(4) {
            animation-delay: 1.5s;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .register-section {
                min-height: 50vh;
            }

            .welcome-section {
                min-height: 50vh;
                padding: 40px 20px;
            }

            .welcome-card h2 {
                font-size: 36px;
            }

            .hero-emoji {
                font-size: 80px;
            }

            .emoji-item {
                font-size: 35px;
            }
        }

        @media (max-width: 480px) {
            .register-box h1 {
                font-size: 32px;
            }

            .welcome-card {
                padding: 40px 30px;
            }

            .welcome-card h2 {
                font-size: 28px;
            }

            .hero-emoji {
                font-size: 60px;
            }
        }
    </style>
    <script>
        // Ensure we run over HTTP and compute a BASE that respects the current port
        (function() {
            var base = (location.protocol === 'file:')
                ? 'http://localhost/smart-study-planner'
                : (location.origin + '/smart-study-planner');
            window.APP_BASE = base;
            if (location.protocol === 'file:') {
                location.replace(base + '/register.html');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <!-- Register Section -->
        <div class="register-section">
            <div class="register-box">
                <h1>Sign Up ✨</h1>
                <p class="subtitle">Create your account to get started</p>

                <form id="registerForm">
                    <div class="alert alert-error" id="errorMsg"></div>
                    <div class="alert alert-success" id="successMsg"></div>

                    <div class="input-group">
                        <label>👤 Full Name</label>
                        <input type="text" id="username" name="username" required placeholder="" minlength="3">
                    </div>

                    <div class="input-group">
                        <label>📧 Email</label>
                        <input type="email" id="email" name="email" required placeholder="">
                    </div>

                    <div class="input-group">
                        <label>🔑 Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="" minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                👁️
                            </button>
                        </div>
                        <small>Must be at least 6 characters</small>
                    </div>

                    <div class="input-group">
                        <label>🔒 Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="">
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>⏰ Daily Study Hours Available</label>
                        <select id="studyHours" name="studyHours" required>
                            <option value="">Select hours</option>
                            <option value="2">2 hours ⏱️</option>
                            <option value="3">3 hours ⏱️</option>
                            <option value="4">4 hours ⏱️</option>
                            <option value="5">5 hours ⏱️</option>
                            <option value="6">6 hours ⏱️</option>
                            <option value="7">7 hours ⏱️</option>
                            <option value="8">8 hours ⏱️</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>🌅 Preferred Study Time</label>
                        <select id="preferredTime" name="preferredTime" required>
                            <option value="">Select preferred time</option>
                            <option value="morning">Morning 🌅 (6 AM - 12 PM)</option>
                            <option value="afternoon">Afternoon 🌤️ (12 PM - 6 PM)</option>
                            <option value="evening">Evening 🌙 (6 PM - 12 AM)</option>
                        </select>
                    </div>

                    <button type="submit" class="register-btn">Create Account</button>
                </form>

                <div class="login-prompt">
                    <span>Already have an account? 🤔</span>
                    <a href="login.html" class="login-btn">Login 🔐</a>
                </div>
            </div>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <!-- Floating Emojis -->
            <div class="floating-emoji emoji-1">📚</div>
            <div class="floating-emoji emoji-2">🎯</div>
            <div class="floating-emoji emoji-3">⭐</div>
            <div class="floating-emoji emoji-4">💡</div>
            <div class="floating-emoji emoji-5">🚀</div>
            <div class="floating-emoji emoji-6">✨</div>
            <div class="floating-emoji emoji-7">🎨</div>

            <div class="welcome-card">
                <h2>Join Our 🌟<br>Student Portal</h2>
                <p class="welcome-subtitle">Sign up to start organizing your studies</p>

                <div class="illustration-container">
                    <div class="hero-emoji">🎓</div>
                    <div class="emoji-row">
                        <span class="emoji-item">📖</span>
                        <span class="emoji-item">💻</span>
                        <span class="emoji-item">🏆</span>
                        <span class="emoji-item">🎯</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleBtn = passwordInput.nextElementSibling;

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Form submission handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const studyHours = document.getElementById('studyHours').value;
            const preferredTime = document.getElementById('preferredTime').value;

            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            // Hide previous messages
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            // Validate passwords match
            if (password !== confirmPassword) {
                errorMsg.textContent = '❌ Passwords do not match.';
                errorMsg.classList.add('show');
                return;
            }

            try {
                const response = await fetch(window.APP_BASE + '/includes/api_auth.php?action=register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        studyHours,
                        preferredTime
                    })
                });

                const data = await response.json();
                // Ensure the user also exists in localStorage for dashboard storage.js
                try {
                    if (data && data.success) {
                        const usersRaw = localStorage.getItem('users') || '[]';
                        const users = JSON.parse(usersRaw);
                        if (!users.some(u => u.email === email)) {
                            users.push({
                                id: Date.now(),
                                username: username,
                                email: email,
                                password: password,
                                studyHoursPerDay: parseInt(studyHours) || 2,
                                preferredTime: preferredTime || 'evening',
                                createdAt: new Date().toISOString()
                            });
                            localStorage.setItem('users', JSON.stringify(users));
                        }
                    }
                } catch (e) {}

                if (data.success) {
                    successMsg.textContent = '✅ ' + (data.message || 'Account created successfully! Redirecting to login...');
                    successMsg.classList.add('show');
                    setTimeout(() => {
                        window.location.href = window.APP_BASE + '/login.html';
                    }, 2000);
                } else {
                    errorMsg.textContent = '❌ ' + (data.message || 'Registration failed. Please try again.');
                    errorMsg.classList.add('show');
                }
            } catch (error) {
                errorMsg.textContent = '❌ An error occurred. Please try again.';
                errorMsg.classList.add('show');
            }
        });

        // Add interactive emoji effects
        document.querySelectorAll('.emoji-item').forEach(emoji => {
            emoji.addEventListener('click', function() {
                this.style.animation = 'none';
                setTimeout(() => {
                    this.style.animation = '';
                }, 10);
            });
        });
    </script>
</body>
</html>
